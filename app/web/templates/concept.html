<div id="concept-page" class="p-6 max-w-[68ch] mx-auto prose prose-slate">
  <h1 class="text-3xl font-newsreader font-bold mb-2">{{ concept.title }}</h1>
  <div class="text-sm text-gray-500 mb-6 font-mono">{{ concept.module }}</div>
  
  <div class="synthesis">
    <!-- In a real app we'd convert markdown synthesis to HTML -->
    {{ concept.synthesis }}
  </div>
  
  {% if concept.citations %}
  <div class="mt-8 pt-4 border-t border-gray-200">
    <h3 class="text-lg font-bold">Citations</h3>
    <ul class="text-sm font-mono text-gray-600">
      {% for citation in concept.citations %}
      <li>{{ citation }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
