{% extends "base.html" %}

{% block title %}Graph - abtahi.fyi{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-3xl mb-4">Network Map</h1>
    <p class="text-stone-400 mb-8">A visual exploration of the conceptual connections within the study corpus.</p>
    
    <div id="graph-container" class="w-full h-[600px] border border-stone-800 rounded bg-stone-900/50"></div>
</div>

<!-- Load Force Graph -->
<script src="https://unpkg.com/force-graph"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const nodes = {{ nodes | tojson | safe }};
        const links = {{ links | tojson | safe }};
        
        const elem = document.getElementById('graph-container');
        
        // Define aesthetic colors based on The Systems Scriptorium
        const colorPalette = [
            '#a8a29e', // stone-400
            '#78716c', // stone-500
            '#57534e', // stone-600
            '#d6d3d1'  // stone-300
        ];
        
        const Graph = ForceGraph()(elem)
            .graphData({ nodes, links })
            .nodeLabel('title')
            .nodeColor(node => colorPalette[node.group % colorPalette.length])
            .linkColor(() => '#44403c') // stone-700
            .nodeRelSize(6)
            .backgroundColor('#0c0a09') // stone-950
            .onNodeClick(node => {
                window.location.href = `/i/${node.id}`;
            });
            
        // Handle window resize
        window.addEventListener('resize', () => {
            Graph.width(elem.clientWidth).height(elem.clientHeight);
        });
    });
</script>
{% endblock %}
