<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}abtahi.fyi{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A private study knowledge graph connecting trusted sources to WorldQuant University concepts.{% endblock %}">

    <!-- Theme Initialization Script (prevents FOUC) -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Fonts: Bellefair (display), Inter (body), JetBrains Mono (meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">

    <!-- Static Assets -->
    <link href="/static/css/styles.css?v=2" rel="stylesheet">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white dark:bg-stone-950 text-stone-800 dark:text-stone-300 font-sans min-h-screen flex flex-col transition-colors duration-200" hx-boost="true">

    <header class="border-b border-stone-200 dark:border-stone-800 py-5 bg-white/95 dark:bg-stone-950/95 backdrop-blur-sm sticky top-0 z-40 transition-colors duration-200">
        <div class="max-w-4xl mx-auto px-6 flex items-baseline justify-between">
            <a href="/" class="font-['Bellefair'] text-xl text-stone-900 dark:text-stone-100 no-underline hover:text-pink-600 dark:hover:text-pink-400 transition-colors tracking-wide" style="font-family:'Bellefair',serif;font-size:21px;">
                abtahi.fyi
            </a>
            <nav class="flex items-center gap-6 text-sm font-medium font-mono">
                <a href="/" class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-200 no-underline transition-colors">Timeline</a>
                <a href="/graph" class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-200 no-underline transition-colors">Graph</a>
                <a href="/today" class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-200 no-underline transition-colors">Study</a>
                <a href="/search" class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-200 no-underline transition-colors" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </a>
                <button id="theme-toggle" class="text-stone-500 hover:text-stone-900 dark:hover:text-stone-200 transition-colors focus:outline-none" aria-label="Toggle Dark Mode"
                        x-data="{ isDark: document.documentElement.classList.contains('dark') }"
                        @click="isDark = !isDark; 
                                if (isDark) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); } 
                                else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }">
                    <svg x-show="!isDark" style="display: none;" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg x-show="isDark" style="display: none;" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <div class="max-w-4xl mx-auto px-6">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="border-t border-stone-200 dark:border-stone-800 py-8 mt-16 transition-colors duration-200">
        <div class="max-w-4xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-xs text-stone-400 font-mono">
            <div class="tabular-nums">&copy; 2026 abtahi.fyi</div>
            <div class="flex items-center gap-5">
                <a href="/about" class="hover:text-stone-700 dark:hover:text-stone-300 transition-colors no-underline">About</a>
                <a href="/feed.json" class="hover:text-stone-700 dark:hover:text-stone-300 transition-colors no-underline">JSON Feed</a>
                <a href="/tensions" class="hover:text-stone-700 dark:hover:text-stone-300 transition-colors no-underline">Tensions</a>
                <a href="/themes" class="hover:text-stone-700 dark:hover:text-stone-300 transition-colors no-underline">Themes</a>
            </div>
        </div>
    </footer>

    <script>
        if (!window._lucideInitialized) {
            window._lucideInitialized = true;
            lucide.createIcons();
            document.body.addEventListener('htmx:afterSwap', function() {
                lucide.createIcons();
            });
        }
    </script>
</body>
</html>
