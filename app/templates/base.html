<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}abtahi.fyi{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A private study knowledge graph connecting trusted sources to WorldQuant University concepts.{% endblock %}">

    <!-- Fonts: Bellefair (display), Inter (body), JetBrains Mono (meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">

    <!-- Static Assets -->
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/alpine.min.js" defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white text-stone-800 font-sans min-h-screen flex flex-col" hx-boost="true">

    <header class="border-b border-stone-200 py-5 bg-white/95 backdrop-blur-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 flex items-baseline justify-between">
            <a href="/" class="font-['Bellefair'] text-xl text-stone-900 no-underline hover:text-pink-600 transition-colors tracking-wide" style="font-family:'Bellefair',serif;font-size:21px;">
                abtahi.fyi
            </a>
            <nav class="flex items-center gap-6 text-sm font-medium font-mono">
                <a href="/" class="text-stone-500 hover:text-stone-900 no-underline transition-colors">Timeline</a>
                <a href="/graph" class="text-stone-500 hover:text-stone-900 no-underline transition-colors">Graph</a>
                <a href="/today" class="text-stone-500 hover:text-stone-900 no-underline transition-colors">Study</a>
                <a href="/search" class="text-stone-500 hover:text-stone-900 no-underline transition-colors" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </a>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-stone-200 py-8 mt-16">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-xs text-stone-400 font-mono">
            <div class="tabular-nums">&copy; 2026 abtahi.fyi</div>
            <div class="flex items-center gap-5">
                <a href="/about" class="hover:text-stone-700 transition-colors no-underline">About</a>
                <a href="/feed.json" class="hover:text-stone-700 transition-colors no-underline">JSON Feed</a>
                <a href="/tensions" class="hover:text-stone-700 transition-colors no-underline">Tensions</a>
                <a href="/themes" class="hover:text-stone-700 transition-colors no-underline">Themes</a>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
