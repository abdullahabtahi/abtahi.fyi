{% extends "base.html" %}

{% block title %}Search — abtahi.fyi{% endblock %}
{% block meta_description %}Search across your knowledge graph and evidence archive.{% endblock %}

{% block content %}
<div class="py-12">

  <div class="mb-8 pb-6 border-b border-stone-200">
    <h1 class="text-2xl font-['Bellefair'] text-stone-900 tracking-wide mb-1" style="font-family:'Bellefair',serif;font-weight:400;">
      Search
    </h1>
    <p class="text-xs font-mono text-stone-400">Semantic search across concepts and evidence</p>
  </div>

  <div class="mb-8 relative">
    <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
      <svg class="w-4 h-4 text-stone-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <input
      id="search-query"
      type="text"
      class="w-full bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 text-stone-800 dark:text-stone-200 pl-10 pr-10 py-3 rounded-lg
             focus:outline-none focus:border-stone-400 dark:focus:border-stone-600 focus:ring-1 focus:ring-stone-300 dark:focus:ring-stone-700
             placeholder:text-stone-400 dark:placeholder:text-stone-500 font-sans text-sm transition-colors"
      placeholder="Ask a question or search for concepts..."
      hx-get="/api/semantic"
      hx-trigger="keyup changed delay:400ms"
      hx-target="#search-results"
      hx-indicator="#search-spinner"
      name="query"
      autocomplete="off"
    >
    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
      <svg id="search-spinner" class="htmx-indicator animate-spin w-4 h-4 text-stone-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" style="width:16px;height:16px;">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
    </div>
  </div>

  <div id="search-results" class="space-y-4">
    <!-- Results injected here via HTMX -->
  </div>

</div>
{% endblock %}
