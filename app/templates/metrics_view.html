{% extends "base.html" %}

{% block title %}{{ title }} - abtahi.fyi{% endblock %}

{% block content %}
<div class="space-y-6 max-w-prose mx-auto">
    <header class="mb-12">
        <h1 class="text-3xl mb-2">{{ title }}</h1>
        <p class="text-stone-400 font-mono text-sm">{{ description }}</p>
    </header>
    
    <div class="space-y-8">
        {% for item in items %}
        <article class="group">
            <h3 class="text-lg mb-1">
                <a href="/i/{{ item.id }}">{{ item.title }}</a>
            </h3>
            <div class="text-sm font-mono text-stone-500 tabular-nums">
                {{ metric_label }}: <span class="text-stone-300">{{ item.metric_value }}</span>
            </div>
        </article>
        {% else %}
        <p class="text-stone-500 italic">No data available.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
