<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - abtahi.fyi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 2rem; color: #333; }
        nav { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 2px solid #000; padding-bottom: 1rem; }
        nav a { color: #000; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .item { border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 1rem; }
        .item h3 { margin-bottom: 0.2rem; }
        .item h3 a { color: #000; text-decoration: none; }
        .item h3 a:hover { text-decoration: underline; }
        .metric { font-family: monospace; color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>{{ title }}</h1>
        <p>{{ description }}</p>
    </header>
    
    <nav>
        <a href="/">Timeline</a>
        <a href="/graph">Graph</a>
        <a href="/themes">Themes</a>
        <a href="/tensions">Tensions</a>
        <a href="/feed.json">JSON Feed</a>
    </nav>

    <main>
        {% for item in items %}
        <article class="item">
            <h3><a href="/i/{{ item.id }}">{{ item.title }}</a></h3>
            <div class="metric">{{ metric_label }}: {{ item.metric_value }}</div>
        </article>
        {% else %}
        <p>No data available.</p>
        {% endfor %}
    </main>
</body>
</html>
